name: Build ECR Images

on:
  push:
    branches: [main]
    paths:
      - 'flaubert-drive/**'
      - 'flaubert-shared/**'
      - '.github/workflows/**'

  workflow_dispatch:

env:
  AWS_REGION: ap-northeast-1
  ECR_REGISTRY: 871950640338.dkr.ecr.ap-northeast-1.amazonaws.com

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      drive: ${{ steps.filter.outputs.drive }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            drive: ['flaubert-drive/**', 'flaubert-shared/**']

  build-and-push:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push flaubert-drive
        if: ${{ needs.changes.outputs.drive == 'true' || github.event_name == 'workflow_dispatch' }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./flaubert-drive/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/flaubert-drive:latest
            ${{ env.ECR_REGISTRY }}/flaubert-drive:${{ github.sha }}